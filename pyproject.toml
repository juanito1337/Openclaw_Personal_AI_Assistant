[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-personal-assistant"
version = "3.4.0"
description = "Local privacy-preserving personal assistant with mail, Nextcloud, search, policies and auditable actions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail-agent = "mail_agent.cli:main"
personal-assistant = "personal_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["mail_agent*", "personal_assistant*"]

[tool.setuptools.package-data]
mail_agent = ["*.example.toml"]
personal_assistant = ["tool_defaults.toml", "policy_defaults.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tool descriptions and stable CLI templates are exact generated contract data;
# wrapping them would add runtime string concatenation noise to every definition.
"personal_assistant/tool_catalog/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["mail_agent", "personal_assistant", "docker"]

[tool.coverage.report]
precision = 2
skip_empty = true
