[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-personal-assistant"
version = "3.4.0"
description = "Local privacy-preserving personal assistant with mail, Nextcloud, search, policies and auditable actions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail-agent = "mail_agent.cli:main"
personal-assistant = "personal_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["mail_agent*", "personal_assistant*"]

[tool.setuptools.package-data]
mail_agent = ["*.example.toml"]
personal_assistant = ["tool_defaults.toml", "policy_defaults.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
