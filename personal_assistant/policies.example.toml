[deny]
actions = [
  "files.delete",
  "files.overwrite",
  "contacts.write",
  "contacts.delete",
  "calendar.delete",
  "tasks.delete",
  "plugins.install",
  "code.modify",
  "security.disable",
  "audit.disable",
]

[approval]
# Calendar, task and contact writes require approval. New files are allowed only in
# resource-specific allowlisted roots and are always create-only.
actions = ["calendar.create", "calendar.update", "tasks.create", "tasks.update", "contacts.update", "mail.send"]
