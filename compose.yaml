name: openclaw-agent

x-openclaw-common: &openclaw-common
  image: ${OPENCLAW_IMAGE:?OPENCLAW_IMAGE must be set}
  network_mode: host
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  environment: &openclaw-environment
    TZ: ${TZ:-Europe/Berlin}
    OPENCLAW_RUNTIME: container
    OPENCLAW_WORKSPACE: /home/node/.openclaw/workspace
    MAIL_AGENT_CONFIG: /home/node/.openclaw/workspace/mail_agent/config.toml
    PERSONAL_ASSISTANT_CONFIG: /home/node/.openclaw/workspace/personal_assistant/config.toml
    OPENCLAW_TOOLS_CONFIG: /home/node/.openclaw/workspace/personal_assistant/tools.toml
    OPENCLAW_CONTAINER_CONFIG_DIR: /etc/openclaw-agent
    OPENCLAW_CONTAINER_SECRET_DIR: /run/openclaw-secrets
    OPENCLAW_LOG_DIR: /home/node/.openclaw/workspace/personal_assistant/data/container_logs
    OPENCLAW_JOB_STATUS_DIR: /home/node/.openclaw/workspace/personal_assistant/data/container_jobs
    OLLAMA_PRIORITY_ENV_FILE: /etc/openclaw-agent/ollama-priority.env
    OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
    MAIL_INTERVAL_SECONDS: ${MAIL_INTERVAL_SECONDS:-1200}
    MAIL_INITIAL_DELAY_SECONDS: ${MAIL_INITIAL_DELAY_SECONDS:-120}
    MAIL_DRAIN_BATCH_SIZE: ${MAIL_DRAIN_BATCH_SIZE:-20}
    MAIL_MAX_MESSAGES: ${MAIL_MAX_MESSAGES:-500}
    MAIL_MAX_RUNTIME: ${MAIL_MAX_RUNTIME:-2400}
    MAIL_SHUTDOWN_RESERVE: ${MAIL_SHUTDOWN_RESERVE:-180}
    MAIL_MAX_BATCHES: ${MAIL_MAX_BATCHES:-100}
    SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
    SYNC_INITIAL_DELAY_SECONDS: ${SYNC_INITIAL_DELAY_SECONDS:-300}
    SUPERVISOR_INTERVAL_SECONDS: ${SUPERVISOR_INTERVAL_SECONDS:-300}
    SUPERVISOR_INITIAL_DELAY_SECONDS: ${SUPERVISOR_INITIAL_DELAY_SECONDS:-180}
  volumes:
    - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}:/home/node/.openclaw
    - ${HIMALAYA_CONFIG_DIR:-/srv/openclaw/config/himalaya}:/home/node/.config/himalaya:ro
    - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}:/etc/openclaw-agent:ro
    - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}:/run/openclaw-secrets:ro
    - clamav-db:/var/lib/clamav:ro
  stop_grace_period: 2m

services:
  ollama-proxy:
    <<: *openclaw-common
    container_name: openclaw-ollama-proxy
    command: ["/home/node/.openclaw/workspace/scripts/ollama-priority-proxy.sh", "serve"]
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "proxy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  gateway:
    <<: *openclaw-common
    container_name: openclaw-gateway
    command: ["openclaw", "gateway", "--bind", "lan", "--port", "${OPENCLAW_GATEWAY_PORT:-18789}"]
    depends_on:
      ollama-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "gateway"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  mail-worker:
    <<: *openclaw-common
    container_name: openclaw-mail-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "mail"]
    depends_on:
      ollama-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "mail"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sync-worker:
    <<: *openclaw-common
    container_name: openclaw-sync-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "sync"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "sync"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  supervisor-worker:
    <<: *openclaw-common
    container_name: openclaw-supervisor-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "supervisor"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "supervisor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  agent-cli:
    <<: *openclaw-common
    profiles: ["tools"]
    container_name: openclaw-agent-cli
    restart: "no"
    command: ["/home/node/.openclaw/workspace/scripts/assistant.sh", "status"]

  clamav-update:
    image: ${OPENCLAW_IMAGE:?OPENCLAW_IMAGE must be set}
    profiles: ["maintenance"]
    container_name: openclaw-clamav-update
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          freshclam || true
          sleep ${CLAMAV_UPDATE_INTERVAL_SECONDS:-14400}
        done
    volumes:
      - clamav-db:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (test -s /var/lib/clamav/main.cvd || test -s /var/lib/clamav/main.cld) &&
          (test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld) &&
          (test -s /var/lib/clamav/bytecode.cvd || test -s /var/lib/clamav/bytecode.cld)
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  clamav-db:
