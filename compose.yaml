name: openclaw-agent

# M4: immutable, non-root defaults. Role-specific limits are intentionally
# explicit below and are verified against docs/architecture/runtime-hardening.json.
x-openclaw-common: &openclaw-common
  image: ${OPENCLAW_IMAGE:?OPENCLAW_IMAGE must be set}
  user: "1000:1000"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 2m
  environment: &openclaw-environment
    TZ: ${TZ:-Europe/Berlin}
    HOME: /home/node
    OPENCLAW_RUNTIME: container
    OPENCLAW_IMAGE_ROOT: /opt/openclaw-agent
    OPENCLAW_CODE_ROOT: /opt/openclaw-agent
    OPENCLAW_RELEASE_ROOT: /opt/openclaw-agent
    OPENCLAW_STATE_ROOT: /run/openclaw-state
    OPENCLAW_WORKSPACE: /home/node/.openclaw/workspace
    OPENCLAW_LAYOUT_MODE: verify
    OPENCLAW_NIX_MODE: "1"
    OPENCLAW_GATEWAY_DATA_DIR: /home/node/.openclaw
    OPENCLAW_MAIL_DATA_DIR: /var/lib/openclaw/mail
    OPENCLAW_CORE_DATA_DIR: /var/lib/openclaw/core
    OPENCLAW_KNOWLEDGE_DATA_DIR: /var/lib/openclaw/knowledge
    OPENCLAW_ORDERS_DATA_DIR: /var/lib/openclaw/orders
    OPENCLAW_PORTFOLIO_DATA_DIR: /var/lib/openclaw/portfolio
    OPENCLAW_MONITORING_DATA_DIR: /var/lib/openclaw/monitoring
    OPENCLAW_SECURITY_DATA_DIR: /var/lib/openclaw/security
    OPENCLAW_COORDINATION_DATA_DIR: /var/lib/openclaw/coordination
    MAIL_AGENT_CONFIG: /home/node/.openclaw/workspace/mail_agent/config.toml
    PERSONAL_ASSISTANT_CONFIG: /home/node/.openclaw/workspace/personal_assistant/config.toml
    OPENCLAW_TOOLS_CONFIG: /home/node/.openclaw/workspace/personal_assistant/tools.toml
    OPENCLAW_TOOL_DEFAULTS_CONFIG: /opt/openclaw-agent/personal_assistant/tool_defaults.toml
    OPENCLAW_POLICY_DEFAULTS_CONFIG: /opt/openclaw-agent/personal_assistant/policy_defaults.toml
    OPENCLAW_CA_DIR: /etc/openclaw-ca
    OPENCLAW_LOG_DIR: /var/lib/openclaw/coordination/container_logs
    OPENCLAW_JOB_STATUS_DIR: /var/lib/openclaw/coordination/container_jobs
    OPENCLAW_EVENT_QUEUE_DIR: /var/lib/openclaw/coordination/gateway_events
    OPENCLAW_GATEWAY_PORT: "18789"
    MAIL_INTERVAL_SECONDS: ${MAIL_INTERVAL_SECONDS:-1200}
    MAIL_INITIAL_DELAY_SECONDS: ${MAIL_INITIAL_DELAY_SECONDS:-120}
    MAIL_DRAIN_BATCH_SIZE: ${MAIL_DRAIN_BATCH_SIZE:-20}
    MAIL_MAX_MESSAGES: ${MAIL_MAX_MESSAGES:-500}
    MAIL_MAX_RUNTIME: ${MAIL_MAX_RUNTIME:-2400}
    MAIL_SHUTDOWN_RESERVE: ${MAIL_SHUTDOWN_RESERVE:-180}
    MAIL_MAX_BATCHES: ${MAIL_MAX_BATCHES:-100}
    MAIL_INDEX_MAX_FOLDERS: ${MAIL_INDEX_MAX_FOLDERS:-500}
    MAIL_INDEX_MAX_MESSAGES: ${MAIL_INDEX_MAX_MESSAGES:-100000}
    MAIL_INDEX_MAX_BYTES: ${MAIL_INDEX_MAX_BYTES:-2000000000}
    MAIL_INDEX_MAX_MESSAGE_BYTES: ${MAIL_INDEX_MAX_MESSAGE_BYTES:-100000000}
    MAIL_INDEX_MAX_RUNTIME: ${MAIL_INDEX_MAX_RUNTIME:-600}
    MAIL_INDEX_REQUEST_INTERVAL: ${MAIL_INDEX_REQUEST_INTERVAL:-0.05}
    MAIL_INDEX_RETENTION_GENERATIONS: ${MAIL_INDEX_RETENTION_GENERATIONS:-2}
    SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
    SYNC_INITIAL_DELAY_SECONDS: ${SYNC_INITIAL_DELAY_SECONDS:-300}
    SUPERVISOR_INTERVAL_SECONDS: ${SUPERVISOR_INTERVAL_SECONDS:-300}
    SUPERVISOR_INITIAL_DELAY_SECONDS: ${SUPERVISOR_INITIAL_DELAY_SECONDS:-180}
    PORTFOLIO_INTERVAL_SECONDS: ${PORTFOLIO_INTERVAL_SECONDS:-900}
    PORTFOLIO_INITIAL_DELAY_SECONDS: ${PORTFOLIO_INITIAL_DELAY_SECONDS:-240}
    MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-3600}
    MONITOR_INITIAL_DELAY_SECONDS: ${MONITOR_INITIAL_DELAY_SECONDS:-420}
    SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-90}
    SCHEDULER_ARBITRATION_SECONDS: ${SCHEDULER_ARBITRATION_SECONDS:-2}
    SCHEDULER_STARVATION_SECONDS: ${SCHEDULER_STARVATION_SECONDS:-1800}

services:
  layout-init:
    <<: *openclaw-common
    container_name: openclaw-layout-init
    restart: "no"
    network_mode: none
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: layout-init
      OPENCLAW_LAYOUT_MODE: migrate
      OPENCLAW_STATE_ROOT: /var/lib/openclaw-state
      OPENCLAW_WORKSPACE: /var/lib/openclaw-state/workspace
    command: ["/bin/true"]
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}:/var/lib/openclaw-state

  ollama-proxy:
    <<: *openclaw-common
    image: ${OPENCLAW_PROXY_IMAGE:?OPENCLAW_PROXY_IMAGE must be set}
    container_name: openclaw-ollama-proxy
    pids_limit: 256
    cpus: 2.0
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: ollama-proxy
      OLLAMA_PRIORITY_ENV_FILE: /etc/openclaw-env/ollama-priority.env
    depends_on:
      layout-init:
        condition: service_completed_successfully
    command: ["/opt/openclaw-agent/scripts/ollama-priority-proxy.sh", "serve"]
    expose: ["11435"]
    networks: [backend, egress]
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "proxy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ollama-priority.env:/etc/openclaw-env/ollama-priority.env:ro

  gateway:
    <<: *openclaw-common
    container_name: openclaw-gateway
    pids_limit: 512
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: gateway
    command: ["openclaw", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - ${OPENCLAW_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:18789
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
      ollama-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "gateway"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/gateway:/home/node/.openclaw
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace
      # The interactive agent may maintain its profile and memory, but instance
      # configuration is administrator-owned.  Explicit setup uses agent-cli.
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance/mail_agent:/home/node/.openclaw/workspace/mail_agent:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance/personal_assistant:/home/node/.openclaw/workspace/personal_assistant:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/mail:/var/lib/openclaw/mail
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/orders:/var/lib/openclaw/orders
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/portfolio:/var/lib/openclaw/portfolio
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/monitoring:/var/lib/openclaw/monitoring
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/knowledge:/var/lib/openclaw/knowledge
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/core:/var/lib/openclaw/core
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/security:/var/lib/openclaw/security
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${HIMALAYA_CONFIG_DIR:-/srv/openclaw/config/himalaya}:/home/node/.config/himalaya:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/gateway.env:/run/openclaw-env/gateway.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/mail-agent.env:/run/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-imap-password:/run/openclaw-secrets/himalaya-imap-password:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-smtp-password:/run/openclaw-secrets/himalaya-smtp-password:ro
      - clamav-db:/var/lib/clamav:ro

  mail-worker:
    <<: *openclaw-common
    container_name: openclaw-mail-worker
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: mail-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "mail"]
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
      ollama-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "mail"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/mail:/var/lib/openclaw/mail
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/orders:/var/lib/openclaw/orders
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/core:/var/lib/openclaw/core
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/security:/var/lib/openclaw/security
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${HIMALAYA_CONFIG_DIR:-/srv/openclaw/config/himalaya}:/home/node/.config/himalaya:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/mail-agent.env:/etc/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/mail-agent.env:/run/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-imap-password:/run/openclaw-secrets/himalaya-imap-password:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-smtp-password:/run/openclaw-secrets/himalaya-smtp-password:ro
      - clamav-db:/var/lib/clamav:ro

  sync-worker:
    <<: *openclaw-common
    container_name: openclaw-sync-worker
    pids_limit: 192
    cpus: 1.0
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: sync-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "sync"]
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "sync"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/mail:/var/lib/openclaw/mail:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/knowledge:/var/lib/openclaw/knowledge
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/core:/var/lib/openclaw/core:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/mail-agent.env:/etc/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/personal-assistant.env:/etc/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/mail-agent.env:/run/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro

  supervisor-worker:
    <<: *openclaw-common
    container_name: openclaw-supervisor-worker
    pids_limit: 128
    cpus: 0.5
    # Complete checks invoke the OpenClaw Node CLI; 512 MiB caused a confirmed
    # cgroup OOM kill of the supervised child process.
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: supervisor-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "supervisor"]
    networks: [backend]
    depends_on:
      layout-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "supervisor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination

  portfolio-worker:
    <<: *openclaw-common
    container_name: openclaw-portfolio-worker
    pids_limit: 192
    cpus: 1.0
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: portfolio-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "portfolio"]
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "portfolio"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/portfolio:/var/lib/openclaw/portfolio
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/personal-assistant.env:/etc/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro

  monitor-worker:
    <<: *openclaw-common
    container_name: openclaw-monitor-worker
    pids_limit: 192
    cpus: 1.0
    mem_limit: 1g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: monitor-worker
    command: ["python3", "/opt/openclaw-agent/docker/job_loop.py", "monitor"]
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/openclaw-agent/docker/healthcheck.sh", "worker", "monitor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/mail:/var/lib/openclaw/mail:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/portfolio:/var/lib/openclaw/portfolio:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/monitoring:/var/lib/openclaw/monitoring
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/knowledge:/var/lib/openclaw/knowledge:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/core:/var/lib/openclaw/core:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/security:/var/lib/openclaw/security:ro
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/mail-agent.env:/etc/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/personal-assistant.env:/etc/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/mail-agent.env:/run/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro

  agent-cli:
    <<: *openclaw-common
    profiles: [tools]
    container_name: openclaw-agent-cli
    restart: "no"
    pids_limit: 512
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *openclaw-environment
      OPENCLAW_ROLE: agent-cli
    command: ["/opt/openclaw-agent/scripts/assistant.sh", "status"]
    networks: [backend, egress]
    depends_on:
      layout-init:
        condition: service_completed_successfully
    volumes:
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/gateway:/home/node/.openclaw
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/instance:/home/node/.openclaw/workspace
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/mail:/var/lib/openclaw/mail
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/orders:/var/lib/openclaw/orders
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/portfolio:/var/lib/openclaw/portfolio
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/monitoring:/var/lib/openclaw/monitoring
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/domains/knowledge:/var/lib/openclaw/knowledge
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/core:/var/lib/openclaw/core
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/security:/var/lib/openclaw/security
      - ${OPENCLAW_STATE_DIR:-/srv/openclaw/state}/v3/shared/coordination:/var/lib/openclaw/coordination
      - ${HIMALAYA_CONFIG_DIR:-/srv/openclaw/config/himalaya}:/home/node/.config/himalaya:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/ca:/etc/openclaw-ca:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/mail-agent.env:/etc/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_CONFIG_DIR:-/srv/openclaw/config}/personal-assistant.env:/etc/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/mail-agent.env:/run/openclaw-env/mail-agent.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/personal-assistant.env:/run/openclaw-env/personal-assistant.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/gateway.env:/run/openclaw-env/gateway.env:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-imap-password:/run/openclaw-secrets/himalaya-imap-password:ro
      - ${OPENCLAW_SECRETS_DIR:-/srv/openclaw/secrets}/himalaya-smtp-password:/run/openclaw-secrets/himalaya-smtp-password:ro
      - clamav-db:/var/lib/clamav:ro

  clamav-update:
    image: ${OPENCLAW_MAINTENANCE_IMAGE:?OPENCLAW_MAINTENANCE_IMAGE must be set}
    profiles: [maintenance]
    container_name: openclaw-clamav-update
    user: "100:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/log/clamav:rw,nosuid,nodev,noexec,size=16m,mode=0750
    pids_limit: 128
    cpus: 1.0
    # freshclam validates a complete replacement database before publishing it.
    # Current signature sets can exceed 512 MiB while being loaded and otherwise
    # get killed by the container memory limit in the protected rollout window.
    mem_limit: 2g
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    stop_grace_period: 30s
    entrypoint: ["/sbin/tini", "--", "/opt/openclaw-agent/docker/clamav-update.sh"]
    environment:
      CLAMAV_DATABASE_DIR: /var/lib/clamav
      CLAMAV_SIGNATURE_MAX_AGE_SECONDS: ${CLAMAV_SIGNATURE_MAX_AGE_SECONDS:-172800}
      CLAMAV_UPDATE_INTERVAL_SECONDS: ${CLAMAV_UPDATE_INTERVAL_SECONDS:-14400}
    networks: [egress]
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "python3", "-P", "-m", "personal_assistant.clamav_health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m

networks:
  backend:
    internal: true
  egress: {}

volumes:
  clamav-db:
