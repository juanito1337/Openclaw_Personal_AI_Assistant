name: Container image

on:
  workflow_dispatch:
  push:
    branches:
      - "test/**"
    tags:
      - "r*"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: ./scripts/check-repo.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCLAW_BASE_IMAGE=ghcr.io/openclaw/openclaw:2026.6.11
            HIMALAYA_VERSION=1.2.0
            OPENCLAW_SOURCE_REVISION=${{ github.sha }}
      - name: Show live-test image
        if: startsWith(github.ref, 'refs/heads/test/')
        run: |
          echo "Live-Test-Image: ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:12}"
          echo "Auf dem Host aus dem gleichen Commit:"
          echo "./docker/scripts/live-test-branch.sh"
